<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="囍映 AI 婚礼微电影创作台：爱情故事、人物定妆、分镜、视频提示词与剪辑交付的一体化预览。"
    />
    <title>囍映 AI · 婚礼微电影创作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23a9171c'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='38' fill='%23fff4e4'%3E囍%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="paper-noise" aria-hidden="true"></div>
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>
    <div id="cursor-glow" aria-hidden="true"></div>
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="brand" data-route="overview" aria-label="返回项目总览">
          <span class="brand-seal">囍</span>
          <span class="brand-copy">
            <strong>囍映 AI</strong>
            <small>婚礼微电影创作台</small>
          </span>
        </button>

        <nav class="top-tabs" aria-label="工作区导航">
          <button class="top-tab active" data-route="overview">
            <span class="tab-mark"></span>创作台
          </button>
          <button class="top-tab" data-route="method">
            <span class="tab-mark"></span>参考拆解
          </button>
          <button class="top-tab" data-route="guide">
            <span class="tab-mark"></span>操作指南
          </button>
        </nav>

        <div class="top-actions">
          <div class="project-pill">
            <span class="status-dot"></span>
            <span id="top-project-name">我们的婚礼微电影</span>
          </div>
          <button class="icon-button" id="save-button" title="保存草稿">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h11l3 3v13H5V4Zm3 0v6h8V4M8 20v-6h8v6" />
            </svg>
            <span>保存</span>
          </button>
          <button class="icon-button" id="fullscreen-button" title="进入全屏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
            </svg>
            <span>全屏</span>
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <div class="sidebar-heading">
          <span>创作工作流</span>
          <span class="version-badge">V1.0</span>
        </div>
        <nav id="nav-tree" class="nav-tree" aria-label="多级创作导航"></nav>
        <div class="sidebar-footer">
          <div class="cli-status">
            <span class="cli-orb"></span>
            <div>
              <strong>统一模型中心</strong>
              <small>文字 · 图片 · 视频 · 语音 · 音乐</small>
            </div>
          </div>
          <button class="ghost-link" data-route="guide">查看生成安全规则 →</button>
          <button class="ghost-link" data-route="settings">项目设置 →</button>
        </div>
      </aside>

      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
